# 持续集成（CI）：push / PR 时跑测试与打包
#
# 这个工作流**不依赖任何 Secret**，任何时候都应该保持绿色。
# 把它和部署分开，是为了避免"没配部署密钥就满屏红叉"——那会让你对红色麻木。
#
# 简历写法：GitHub Actions 持续集成，提交即触发单元测试与构建

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: 测试与打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 阶段 5 在 pom.xml 里接入 Spotless 后，把下面两步打开
      # - name: 代码格式检查
      #   run: mvn -B spotless:check

      - name: 运行单元测试
        run: mvn -B test

      - name: 打包
        run: mvn -B clean package -DskipTests

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
