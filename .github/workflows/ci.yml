# 持续集成（CI）：push / PR 时跑测试与打包
#
# 这个工作流**不依赖任何 Secret**，任何时候都应该保持绿色。
# 把它和部署分开，是为了避免"没配部署密钥就满屏红叉"——那会让你对红色麻木。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 测试与打包
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 阶段 5 在 pom.xml 里接入 Spotless 后，把下面两步打开
      # - name: 代码格式检查
      #   run: mvn -B spotless:check

      # 一条命令同时跑测试和打包。测试报告会留在 target/surefire-reports/，
      # 而单独的 mvn clean package 会把上一步的测试报告一起清掉 —— 所以合成一步。
      - name: 运行单元测试并打包
        run: mvn -B clean package

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
