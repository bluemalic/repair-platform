# 持续集成（CI）：push / PR 时跑测试与打包
#
# 这个工作流**不依赖任何 Secret**，任何时候都应该保持绿色。
# 把它和部署分开，是为了避免"没配部署密钥就满屏红叉"——那会让你对红色麻木。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 测试与打包
    runs-on: ubuntu-latest

    # 测试要连真实的 MySQL / Redis：Hikari 是懒连接的，没有它们启动期不会报错，
    # CI 就成了"假绿"；而配了 URL 却连不上时又会直接失败。这两个是一次性的临时
    # 测试环境，凭据写死在这里，不依赖任何 Secret。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: repair
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 阶段 5 在 pom.xml 里接入 Spotless 后，把下面两步打开
      # - name: 代码格式检查
      #   run: mvn -B spotless:check

      # 测试库的表结构不再手工灌：MySQL 服务已用 MYSQL_DATABASE=repair 建好库，
      # 剩下的交给 Flyway —— 测试上下文启动时会自己把迁移脚本跑完（空库从 V1 建起）。
      # 这一步以前是 `mysql < docs/schema.sql`，schema.sql 退役后一并删掉。

      # 一条命令同时跑测试和打包。测试报告会留在 target/surefire-reports/，
      # 而单独的 mvn clean package 会把上一步的测试报告一起清掉 —— 所以合成一步。
      # 变量名与 docker-compose.yml 的 app.environment 对齐，配置读取方式见 application.yml。
      # 对象存储（MinIO）为什么不用 services 起：Actions 的 service 不支持覆盖容器启动命令，
      # 而这个镜像不带 `server /data` 参数会直接退出（表现为 job 卡在 "Initialize containers"）。
      #
      # 为什么用 `docker compose up -d minio` 而不是手写 docker run：
      # **镜像与参数只维护一处**（docker-compose.yml 的 minio 服务），CI 顺带验证了那份配置是对的。
      # 这一点不是洁癖——镜像源已经换过两次（Docker Hub → quay.io → Bitnami legacy，两次都是
      # MinIO 自己收紧分发），手写的那份 docker run 每次都要跟着改一遍，漏一次就是 job 红。
      #
      # 只有"真上传"的用例需要它：类型 / 大小 / 魔数这些校验用例不依赖 MinIO。
      - name: 启动 MinIO（对象存储）
        run: |
          cat > .env <<'EOF'
          MINIO_ROOT_USER=ci-minio-user
          MINIO_ROOT_PASSWORD=ci-minio-password
          MINIO_MEM_LIMIT=512M
          EOF
          docker compose up -d minio
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO 已就绪"
              break
            fi
            sleep 2
          done
          # 断言数据目录确实是那个挂载目录：Bitnami 镜像的数据目录由 MINIO_DATA_DIR 决定，
          # 名字写错不会报错，只会安静地把数据放进容器内层（新机器上等于"重启就丢数据"）。
          # MinIO 启动时会在数据目录建 .minio.sys，用它当证据。
          test -d ./data/minio/.minio.sys || {
            echo "数据目录没落在挂载卷里（检查 MINIO_DATA_DIR）" >&2
            docker compose logs minio
            exit 1
          }
          docker compose ps minio

      - name: 运行单元测试并打包
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: repair
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ci-root-password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          # 真上传用例要连 MinIO（桶由首次上传时自动创建，无需预置）
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_PUBLIC_BASE_URL: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: ci-minio-user
          MINIO_SECRET_KEY: ci-minio-password
          MINIO_BUCKET: repair-ci
        run: mvn -B clean package

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
