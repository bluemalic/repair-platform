# 持续部署（CD）：测试通过 → 同步源码 → 服务器本地构建镜像 → 重启 → 健康检查
#
# **现在仍是手动触发**（Actions 页面 → 左侧选 CD → Run workflow）。
# 启用前要做的三件前置写在 docs/05 §6，那里同时记着每次"为什么这么设计"的实测依据。
#
# 五个 job 的分工不是随手切的：
#   verify → deploy-app            ：后端链，测试不过就上不了线
#   frontend → deploy-frontend     ：前端链**独立**，与后端互不牵连
# 两条链唯一的共同前提是 SSH 通。
#
# ============================================================
# 为什么后端**由 CI 编译、服务器只组装镜像**（2026-10-15/16 两次实测后定下来的，别再改回去）
#
# 这块设计换了两次，两次都是被实测推翻的，证据都留在下面：
#
# 【第一次：CI 构建镜像 → 推 TCR → 服务器拉】
#   瓶颈在"从境外往境内推"：一层 141MB 推了 52 分钟只到 115MB（约 0.3 Mbps），
#   两层 232MB 要一个多小时。日志原文：`#22 pushing layer 2dc9e195c9e2 114.97MB / 141.61MB 3129.0s`。
#   注意方向性——服务器**拉**很快（实测 11 Mbps），慢的是 CI 往境**推**。
#
# 【第二次：传源码 → 服务器 `docker compose build`】
#   避开了跨境大流量，但服务器得先有 `maven:3.9-eclipse-temurin-17`（约 500MB），
#   而它用的 Docker Hub 镜像站（docker.m.daocloud.io）拉大镜像**间歇性 502**：实测连试两次
#   都失败，而且失败会把已经下载的层**一起丢掉**。此外 2C2G 上再叠一次 Maven 编译有 OOM 风险。
#
# 【现在：verify job 里 mvn 已经打好的 jar（约 60-80MB）→ scp 上传
#        → 服务器用 `Dockerfile.deploy` 组装镜像（只 COPY，几秒）】
#   三个好处：不依赖那个反复 502 的基础镜像、不在 2C2G 上跑 Maven、部署从几分钟变几秒。
#   代价是多了一个文件（`Dockerfile.deploy`），它的运行阶段必须与 `Dockerfile` 保持一致
#   ——两边都写了提示，改一处要同步另一处。
#
# 将来若 CI 换成**境内**的 runner，可以切回"CI 构建镜像 + 推仓库"：那是服务器最省事的做法。
# ============================================================

name: CD

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  # ============================================================
  # 1. 测试与打包。这是"自动测试 + 自动上线"里的前半句：
  #    跑的就是本地那条 `mvn -B clean package`（含 JaCoCo 覆盖率门槛），
  #    所以测试红、覆盖率掉下来，都会直接拦住发布。
  # ============================================================
  verify:
    name: 测试与打包
    runs-on: ubuntu-latest

    # 与 ci.yml 一致：测试要连真实的 MySQL / Redis，否则 Hikari 懒连接会让它变成"假绿"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: repair
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # MinIO 用 compose 起而不是 services：Actions 的 service 不支持覆盖启动命令，
      # 而这个镜像不带 `server /data` 参数会直接退出。理由详见 ci.yml 里的长注释。
      - name: 启动 MinIO（对象存储）
        run: |
          cat > .env <<'EOF'
          MINIO_ROOT_USER=ci-minio-user
          MINIO_ROOT_PASSWORD=ci-minio-password
          MINIO_MEM_LIMIT=512M
          EOF
          docker compose up -d minio
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then break; fi
            sleep 2
          done
          test -d ./data/minio/.minio.sys || { docker compose logs minio; exit 1; }

      - name: 跑测试与打包（含覆盖率门槛）
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: repair
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ci-root-password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_PUBLIC_BASE_URL: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: ci-minio-user
          MINIO_SECRET_KEY: ci-minio-password
          MINIO_BUCKET: repair-ci
        run: mvn -B clean package

      - name: 上传测试报告与覆盖率
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cd-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

      # 这个 jar 是给部署 job 用的。既然这一步已经跑过 `mvn -B clean package`，jar 就是现成的，
      # 传上去（约 60-80MB）比让服务器重新编译更稳——理由见 Dockerfile.deploy 的头注释。
      #
      # `target/*.jar` 不会把 Spring Boot 额外产出的 `.jar.original` 也捎上：那个的后缀是
      # `.original`，不以 `.jar` 结尾。
      - name: 上传 jar（供部署 job 使用）
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 3

  # ============================================================
  # 2. 部署后端：传 jar → 服务器组装镜像 → 重启 → 健康检查 → 失败回滚
  # ============================================================
  deploy-app:
    name: 部署后端到服务器
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 组装一个"只有 Dockerfile 与 jar"的构建上下文。
      # **不能**拿仓库根目录当上下文：那里有 `data/`（容器正在写的 MySQL 与 MinIO 数据，
      # 可能好几个 GB），而 docker 构建时会把整个上下文打包给 daemon——又慢又没必要。
      # 上下文越小，这一步越不可能出意外。
      - name: 组装构建上下文（Dockerfile + jar）
        run: |
          mkdir -p deploy
          cp Dockerfile.deploy deploy/Dockerfile

      - name: 下载 jar 产物
        uses: actions/download-artifact@v7
        with:
          name: app-jar
          path: deploy

      # 产物里的文件名带版本号（`repair-platform-0.0.1-SNAPSHOT.jar`），镜像里统一叫 app.jar，
      # 这样 Dockerfile.deploy 与 Dockerfile 的 COPY 目标能保持一致。
      # 排除 `.original`（那是 Spring Boot 留下的未重打包版，不是可执行 jar）。
      - name: 规范成 app.jar
        run: |
          cd deploy
          jar_file=$(ls *.jar | grep -v '\.original$' | head -1)
          [ -n "$jar_file" ] || { echo "没有找到可执行 jar" >&2; exit 1; }
          mv "$jar_file" app.jar
          ls -lh

      - name: 上传构建上下文
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy
          target: /opt/app/repair

      - name: 组装镜像并重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 只 COPY 一个 jar，几秒的事；给 10 分钟是为了留余量，不是真需要
          command_timeout: 10m
          script: |
            set -e
            cd /opt/app/repair

            # 回滚点必须在构建**之前**记：构建会覆盖 repair-app:latest，
            # 那之后再想找"上一版"就没有名字了
            CURRENT=$(docker compose images -q app 2>/dev/null || true)
            if [ -n "$CURRENT" ]; then
              docker tag "$CURRENT" repair-app:previous
              echo "已记录回滚点：repair-app:previous"
            else
              echo "没有正在运行的 app 容器，跳过回滚点（首次部署）"
            fi

            # 上下文就是 deploy/ 里那两个文件，不碰宿主机上其他任何东西
            cd deploy
            ls -lh
            docker build -t repair-app:latest .
            cd ..

            # compose 里 app 服务的镜像是 ${IMAGE_NAME:-repair-app:latest}，
            # 所以 .env 里的 IMAGE_NAME 必须是这个本地镜像名（不能指向已放弃的仓库地址）
            docker compose up -d --no-deps app
            docker image prune -f
            echo "部署完成：${{ github.sha }}"

      - name: 健康检查
        run: |
          sleep 15
          curl -fsS --max-time 20 http://${{ secrets.SERVER_HOST }}:8080/actuator/health || exit 1

      # 只在健康检查失败时跑：把 previous 复位再起。镜像在服务器本地，不涉及任何网络拉取。
      # 注意 `if: failure()` 对**任何**上游失败都成立（包括"还没走到部署就失败了"），
      # 所以这里把"没有回滚点"当成**无事可做**而不是失败——那不是回滚失败，
      # 而是"容器根本没被动过"。上一次它因此报了假错，把日志搅浑了。
      - name: 健康检查失败 → 回滚到 previous
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/app/repair
            if ! docker image inspect repair-app:previous >/dev/null 2>&1; then
              echo "没有 previous 镜像——失败发生在部署之前，容器从未被动过，无需回滚"
              exit 0
            fi
            docker tag repair-app:previous repair-app:latest
            docker compose up -d --no-deps app
            echo "已回滚到 previous"

  # ============================================================
  # 3. 前端产物：**与后端完全独立的一条链**
  #
  #    这一条解决的是"手工步骤最容易漏"的问题：原来前端产物靠手工上传，
  #    漏过一次 `VITE_DEMO_ACCOUNTS`（见 docs/05 §4.2）。前端产物只有几 MB，
  #    跨境传得动，所以这条链照旧走 scp。
  # ============================================================
  frontend:
    name: 构建两个前端产物
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # `VITE_DEMO_ACCOUNTS` 是**构建时**注入的（前端没有运行时配置），
      # 所以它必须是流水线的一个输入，而不是"某次手工构建时记得加的那句"。
      # 它含演示口令，所以走 Secret 而不是写进 workflow。
      - name: 构建管理端
        working-directory: web-admin
        env:
          VITE_DEMO_ACCOUNTS: ${{ secrets.VITE_DEMO_ACCOUNTS }}
        run: |
          npm ci
          npm run build

      # **两个前端都读这个变量**（web-admin/src/views/LoginView.vue 与
      # miniapp-h5/src/pages/login/login.vue），所以 H5 这一步也必须注入——
      # 漏了它的表现与后端无关：H5 登录页那行账号提示消失，构建照样成功。
      - name: 构建移动端（H5）
        working-directory: miniapp-h5
        env:
          VITE_DEMO_ACCOUNTS: ${{ secrets.VITE_DEMO_ACCOUNTS }}
        run: |
          npm ci
          npm run build:h5

      - name: 打包产物
        run: |
          tar -czf frontend-dist.tar.gz \
            web-admin/dist \
            miniapp-h5/dist/build/h5
          ls -lh frontend-dist.tar.gz

      - name: 上传产物（供下一个 job 取用）
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend-dist.tar.gz
          retention-days: 3

  deploy-frontend:
    name: 部署前端产物到服务器
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist

      - name: 上传并解包
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: frontend-dist.tar.gz
          target: /opt/app/repair

      # nginx 挂的是宿主机目录（./web-admin/dist 与 ./miniapp-h5/dist/build/h5），
      # 所以**换掉文件就生效，不需要重启任何容器**——这也是前端这条链能和后端彻底分开的原因。
      - name: 解包到 nginx 挂载目录
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/app/repair
            # 清掉上一次的产物再解包（手工部署是"往旧目录上解包"，历次构建的旧 chunk 会一直堆在里面：
            # 实测线上 dist 里同时存着三个版本的演示账号提示，其中一份还是占位符 `<你的口令>`）。
            #
            # ⚠️ **必须清内容、不能删目录本身**。这两个目录是 bind mount 到 nginx 容器的源，
            # 而 Docker 在**容器启动时**就固定了源路径对应的 inode。删掉目录再重建，容器手里还是
            # 那个已被删除的旧 inode——它看到的是**空目录**，现象是全站 403
            # （nginx 找不到 index.html 就退化成列目录，而 autoindex 是关的）。
            # 2026-10-15 踩过一次：文件在宿主机上一切正常、`grep` 断言也通过，站点却打不开；
            # 靠 `docker restart repair-nginx` 让它重新解析挂载路径才恢复。
            rm -rf web-admin/dist/* miniapp-h5/dist/build/h5/*
            tar -xzf frontend-dist.tar.gz
            rm -f frontend-dist.tar.gz
            # 断言演示账号提示确实在**两个**产物里：这是唯一一处"构建成功、站点能打开、
            # 但页面就是不对"的失败模式，光看退出码发现不了（docs/05 §4.2 记着它被漏过一次）
            if [ -n "${{ secrets.VITE_DEMO_ACCOUNTS }}" ]; then
              grep -rq "演示账号" web-admin/dist/ \
                || { echo "管理端产物里没有演示账号提示，构建可能漏了 VITE_DEMO_ACCOUNTS" >&2; exit 1; }
              grep -rq "演示账号" miniapp-h5/dist/build/h5/ \
                || { echo "H5 产物里没有演示账号提示，构建可能漏了 VITE_DEMO_ACCOUNTS" >&2; exit 1; }
            fi
            echo "前端产物已更新"

      # 只在服务器上检查文件是不够的。上面那个 `grep` 断言通过只说明**文件在**，
      # 不说明**能被访问到**——bind mount 那个坑就是这样漏过去的：文件在宿主机上完好、
      # grep 通过、而站点 403。所以再补一道 HTTP 层验收，让"部署成功但站点打不开"必须报错。
      - name: 验收：首页真的能打开
        run: |
          for path in "/" "/h5/index.html"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "http://${{ secrets.SERVER_HOST }}:8080${path}")
            echo "$path -> HTTP $code"
            [ "$code" = "200" ] || { echo "首页返回 $code：前端产物没生效（查 bind mount 与 nginx）" >&2; exit 1; }
          done

# ============================================================
# 需要的 Secrets（仓库 Settings → Secrets and variables → Actions）
#
# 实际用到的（6 个）：
#   SERVER_HOST           服务器 IP
#   SERVER_USER           SSH 用户（ubuntu）
#   SERVER_SSH_KEY        SSH 私钥（完整内容，含 BEGIN/END 行）
#   VITE_DEMO_ACCOUNTS    演示站登录页那行账号提示（含演示口令，故走 Secret）
#
# 配了但当前**用不到**的（4 个，可以留着也可以删）：
#   REGISTRY_URL / REGISTRY_NAMESPACE / REGISTRY_USERNAME / REGISTRY_PASSWORD
#   —— 那条"CI 构建镜像推仓库"的路已实测不划算（跨境推 0.3 Mbps，见文件头），
#      改成了服务器本地构建。凭据留着不碍事，将来若 CI 迁到境内 runner 可以直接切回。
# ============================================================
