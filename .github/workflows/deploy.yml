# 持续部署（CD）：测试通过 → 同步源码 → 服务器本地构建镜像 → 重启 → 健康检查
#
# **现在仍是手动触发**（Actions 页面 → 左侧选 CD → Run workflow）。
# 启用前要做的三件前置写在 docs/05 §6，那里同时记着每次"为什么这么设计"的实测依据。
#
# 五个 job 的分工不是随手切的：
#   verify → deploy-app            ：后端链，测试不过就上不了线
#   frontend → deploy-frontend     ：前端链**独立**，与后端互不牵连
# 两条链唯一的共同前提是 SSH 通。
#
# ============================================================
# 为什么后端**不在 CI 里构建镜像**（2026-10-15 实测后改的，别再改回去）
#
# 原设计是 docker/build-push-action 构建镜像 → 推 TCR → 服务器拉取。实测下来这条路的
# **跨境推镜像环节是瓶颈**：从 GitHub 的境外 runner 推 ccr.ccs.tencentyun.com，
# 一层 141MB 推了 52 分钟只到 115MB（约 0.3 Mbps），两层 232MB 需要一个多小时。
# 日志原文：`#22 pushing layer 2dc9e195c9e2 114.97MB / 141.61MB 3129.0s`
#
# 注意方向性：服务器**拉**镜像很快（实测 11 Mbps，见 §6.3），慢的是 CI 往境**推**。
# 所以正确的做法是让"大流量的那一段"留在境内：
#   - 源码包只有几 MB，跨境传得动
#   - 服务器本地构建走它自己的 MAVEN_MIRROR（境内源）+ Docker 层缓存
#   - 不需要镜像仓库，也不需要跨境的 500MB 流量
#
# 这也解释了为什么 TCR 那套凭据现在用不上（见文件末尾的说明）——不是配置错了，
# 是那条路在这个网络拓扑下不划算。将来如果 CI 换成境内的 runner，再考虑切回去。
# ============================================================

name: CD

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  # ============================================================
  # 1. 测试与打包。这是"自动测试 + 自动上线"里的前半句：
  #    跑的就是本地那条 `mvn -B clean package`（含 JaCoCo 覆盖率门槛），
  #    所以测试红、覆盖率掉下来，都会直接拦住发布。
  # ============================================================
  verify:
    name: 测试与打包
    runs-on: ubuntu-latest

    # 与 ci.yml 一致：测试要连真实的 MySQL / Redis，否则 Hikari 懒连接会让它变成"假绿"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: repair
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # MinIO 用 compose 起而不是 services：Actions 的 service 不支持覆盖启动命令，
      # 而这个镜像不带 `server /data` 参数会直接退出。理由详见 ci.yml 里的长注释。
      - name: 启动 MinIO（对象存储）
        run: |
          cat > .env <<'EOF'
          MINIO_ROOT_USER=ci-minio-user
          MINIO_ROOT_PASSWORD=ci-minio-password
          MINIO_MEM_LIMIT=512M
          EOF
          docker compose up -d minio
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then break; fi
            sleep 2
          done
          test -d ./data/minio/.minio.sys || { docker compose logs minio; exit 1; }

      - name: 跑测试与打包（含覆盖率门槛）
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: repair
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ci-root-password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_PUBLIC_BASE_URL: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: ci-minio-user
          MINIO_SECRET_KEY: ci-minio-password
          MINIO_BUCKET: repair-ci
        run: mvn -B clean package

      - name: 上传测试报告与覆盖率
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cd-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  # ============================================================
  # 2. 部署后端：同步源码 → 服务器本地构建 → 重启 → 健康检查 → 失败回滚
  # ============================================================
  deploy-app:
    name: 部署后端到服务器
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 排除项每一条都有理由，尤其是前两条：
      #   .env  —— 服务器上的 .env 才是真的（数据库口令、演示开关都在里面）。
      #            打进包里会把本地/CI 的配置覆盖上去，那是灾难性的
      #   data / logs —— 容器正在写的 MySQL 与 MinIO 数据目录，绝不能覆盖
      # 其余是构建产物与本地环境（node_modules 几百 MB，传过去也没用）
      - name: 打包源码
        run: |
          tar -czf source.tar.gz \
            --exclude='./.git' \
            --exclude='./.idea' \
            --exclude='./.env' \
            --exclude='./data' \
            --exclude='./logs' \
            --exclude='./target' \
            --exclude='./web-admin/node_modules' \
            --exclude='./web-admin/dist' \
            --exclude='./miniapp-h5/node_modules' \
            --exclude='./miniapp-h5/dist' \
            .
          ls -lh source.tar.gz

      - name: 上传源码包
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: source.tar.gz
          target: /opt/app/repair

      - name: 构建并重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 服务器本地构建比拉取慢一些，但省掉跨境流量（见文件头）。给足超时。
          command_timeout: 20m
          script: |
            set -e
            cd /opt/app/repair

            # 回滚点必须在构建**之前**记：`docker compose build` 会把 repair-app:latest 覆盖掉，
            # 那之后再想找"上一版"就没有名字了
            CURRENT=$(docker compose images -q app 2>/dev/null || true)
            if [ -n "$CURRENT" ]; then
              docker tag "$CURRENT" repair-app:previous
              echo "已记录回滚点：repair-app:previous"
            else
              echo "没有正在运行的 app 容器，跳过回滚点（首次部署）"
            fi

            # 解包（包里不含 .env / data / logs，排除项见 CI 那一步）
            tar -xzf source.tar.gz
            rm -f source.tar.gz

            # 本地构建：有 Docker 层缓存，pom.xml 不变时不会重新下依赖；
            # 依赖走 .env 里的 MAVEN_MIRROR（境内源），所以不会卡在 Maven Central 上
            docker compose build app
            docker compose up -d --no-deps app
            docker image prune -f
            echo "部署完成：${{ github.sha }}"

      - name: 健康检查
        run: |
          sleep 15
          curl -fsS --max-time 20 http://${{ secrets.SERVER_HOST }}:8080/actuator/health || exit 1

      # 只在健康检查失败时跑：把 previous 复位再起。镜像在服务器本地，不涉及任何网络拉取
      - name: 健康检查失败 → 回滚到 previous
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/app/repair
            if ! docker image inspect repair-app:previous >/dev/null 2>&1; then
              echo "没有 previous 镜像，无法自动回滚；需要人工处理" >&2
              exit 1
            fi
            docker tag repair-app:previous repair-app:latest
            docker compose up -d --no-deps app
            echo "已回滚到 previous"

  # ============================================================
  # 3. 前端产物：**与后端完全独立的一条链**
  #
  #    这一条解决的是"手工步骤最容易漏"的问题：原来前端产物靠手工上传，
  #    漏过一次 `VITE_DEMO_ACCOUNTS`（见 docs/05 §4.2）。前端产物只有几 MB，
  #    跨境传得动，所以这条链照旧走 scp。
  # ============================================================
  frontend:
    name: 构建两个前端产物
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # `VITE_DEMO_ACCOUNTS` 是**构建时**注入的（前端没有运行时配置），
      # 所以它必须是流水线的一个输入，而不是"某次手工构建时记得加的那句"。
      # 它含演示口令，所以走 Secret 而不是写进 workflow。
      - name: 构建管理端
        working-directory: web-admin
        env:
          VITE_DEMO_ACCOUNTS: ${{ secrets.VITE_DEMO_ACCOUNTS }}
        run: |
          npm ci
          npm run build

      # **两个前端都读这个变量**（web-admin/src/views/LoginView.vue 与
      # miniapp-h5/src/pages/login/login.vue），所以 H5 这一步也必须注入——
      # 漏了它的表现与后端无关：H5 登录页那行账号提示消失，构建照样成功。
      - name: 构建移动端（H5）
        working-directory: miniapp-h5
        env:
          VITE_DEMO_ACCOUNTS: ${{ secrets.VITE_DEMO_ACCOUNTS }}
        run: |
          npm ci
          npm run build:h5

      - name: 打包产物
        run: |
          tar -czf frontend-dist.tar.gz \
            web-admin/dist \
            miniapp-h5/dist/build/h5
          ls -lh frontend-dist.tar.gz

      - name: 上传产物（供下一个 job 取用）
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend-dist.tar.gz
          retention-days: 3

  deploy-frontend:
    name: 部署前端产物到服务器
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist

      - name: 上传并解包
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: frontend-dist.tar.gz
          target: /opt/app/repair

      # nginx 挂的是宿主机目录（./web-admin/dist 与 ./miniapp-h5/dist/build/h5），
      # 所以**换掉文件就生效，不需要重启任何容器**——这也是前端这条链能和后端彻底分开的原因。
      - name: 解包到 nginx 挂载目录
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/app/repair
            # 解包前先删旧目录。手工部署是"往旧目录上解包"，历次构建的旧 chunk 会一直堆在里面
            # （实测线上 dist 里同时存着三个版本的演示账号提示，其中一份还是占位符 `<你的口令>`）。
            # 旧 chunk 不会被 index.html 引用、功能上无害，但会让"这个文件到底哪来的"变成难题。
            rm -rf web-admin/dist miniapp-h5/dist
            tar -xzf frontend-dist.tar.gz
            rm -f frontend-dist.tar.gz
            # 断言演示账号提示确实在**两个**产物里：这是唯一一处"构建成功、站点能打开、
            # 但页面就是不对"的失败模式，光看退出码发现不了（docs/05 §4.2 记着它被漏过一次）
            if [ -n "${{ secrets.VITE_DEMO_ACCOUNTS }}" ]; then
              grep -rq "演示账号" web-admin/dist/ \
                || { echo "管理端产物里没有演示账号提示，构建可能漏了 VITE_DEMO_ACCOUNTS" >&2; exit 1; }
              grep -rq "演示账号" miniapp-h5/dist/build/h5/ \
                || { echo "H5 产物里没有演示账号提示，构建可能漏了 VITE_DEMO_ACCOUNTS" >&2; exit 1; }
            fi
            echo "前端产物已更新"

# ============================================================
# 需要的 Secrets（仓库 Settings → Secrets and variables → Actions）
#
# 实际用到的（6 个）：
#   SERVER_HOST           服务器 IP
#   SERVER_USER           SSH 用户（ubuntu）
#   SERVER_SSH_KEY        SSH 私钥（完整内容，含 BEGIN/END 行）
#   VITE_DEMO_ACCOUNTS    演示站登录页那行账号提示（含演示口令，故走 Secret）
#
# 配了但当前**用不到**的（4 个，可以留着也可以删）：
#   REGISTRY_URL / REGISTRY_NAMESPACE / REGISTRY_USERNAME / REGISTRY_PASSWORD
#   —— 那条"CI 构建镜像推仓库"的路已实测不划算（跨境推 0.3 Mbps，见文件头），
#      改成了服务器本地构建。凭据留着不碍事，将来若 CI 迁到境内 runner 可以直接切回。
# ============================================================
