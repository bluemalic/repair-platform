# 高校后勤报修平台 —— 单机部署编排
#
# 本地开发：  docker compose up -d mysql redis minio    （只起中间件，应用在 IDEA 里跑）
# 服务器部署：docker compose up -d                       （全部服务，含 app 和 nginx）
#
# 用法：cp .env.example .env && 填好变量
# 中间件端口只绑 127.0.0.1（仅本机可达）：MySQL 13306、Redis 6379、MinIO 9000/9001

services:
  mysql:
    image: mysql:8.0
    container_name: repair-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repair}
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
      --max-connections=200
      --slow-query-log=1
      --long-query-time=1
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [backend]
    # 绑定 127.0.0.1：既能让你本机 IDEA 连上，又不会暴露到局域网/公网（服务器上同样安全）
    # 宿主端口用 13306 而非 3306：本机已装原生 MySQL80 服务占着 3306
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    # redis-stack 比官方镜像多出 RediSearch，为 M4 的 AI 向量检索准备
    # 若拉取困难或服务器内存紧张，改用下面注释掉的官方镜像即可（缓存/Token/延迟队列不受影响）
    image: redis/redis-stack-server:7.2.0-v10
    # image: redis:7-alpine
    container_name: repair-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks: [backend]
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 384M

  minio:
    image: minio/minio:latest
    container_name: repair-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    networks: [backend]
    # 只给本机访问：9000 是 S3 API（应用/调试用），9001 是管理台
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    deploy:
      resources:
        limits:
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-repair-app:latest}
    container_name: repair-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repair}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # AI 相关：Key 只从环境变量注入，绝不写进代码或仓库
      AI_MODEL_API_KEY: ${AI_MODEL_API_KEY}
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL:-https://api.deepseek.com}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-deepseek-chat}
    volumes:
      - ./logs/app:/app/logs
    networks: [backend, frontend]
    deploy:
      resources:
        limits:
          memory: 768M

  nginx:
    image: nginx:1.27-alpine
    container_name: repair-nginx
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # ⚠️ 以下两个前端产物目录尚未创建（前端工程未开始，见 README「当前进度」）：
      #    目录不存在时 Docker 会挂成空目录，访问 / 与 /h5/ 会是 403 —— 属预期，不是故障。
      #    前端就绪后把 dist 构建到这两个路径即可，无需改这里。
      - ./web-admin/dist:/usr/share/nginx/html/admin:ro
      - ./miniapp-h5/dist:/usr/share/nginx/html/h5:ro
    networks: [frontend]

networks:
  backend:
    internal: false
  frontend:
