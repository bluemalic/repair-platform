# 高校后勤报修平台 —— 单机部署编排
# 用法：cp .env.example .env && 填好变量 && docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: repair-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repair}
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
      --max-connections=200
      --slow-query-log=1
      --long-query-time=1
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [backend]
    # 注意：不映射端口到宿主机 —— 数据库只在内网可达
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    # 用 redis-stack 一次拿到 缓存 + 向量检索(RediSearch)
    # 内存紧张时换成 redis:7-alpine，但向量检索需要另想办法
    image: redis/redis-stack-server:7.2.0-v10
    container_name: repair-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 384M

  minio:
    image: minio/minio:latest
    container_name: repair-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    networks: [backend]
    # 管理台只给本机访问，避免公网暴露
    ports:
      - "127.0.0.1:9001:9001"
    deploy:
      resources:
        limits:
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-repair-app:latest}
    container_name: repair-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repair}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # AI 相关：Key 只从环境变量注入，绝不写进代码或仓库
      AI_MODEL_API_KEY: ${AI_MODEL_API_KEY}
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL:-https://api.deepseek.com}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-deepseek-chat}
    volumes:
      - ./logs/app:/app/logs
    networks: [backend, frontend]
    deploy:
      resources:
        limits:
          memory: 768M

  nginx:
    image: nginx:1.27-alpine
    container_name: repair-nginx
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-admin/dist:/usr/share/nginx/html/admin:ro
      - ./miniapp-h5/dist:/usr/share/nginx/html/h5:ro
    networks: [frontend]

networks:
  backend:
    internal: false
  frontend:
