# 高校后勤报修平台 —— 单机部署编排
#
# 本地开发：  docker compose up -d mysql redis minio    （只起中间件，应用在 IDEA 里跑）
# 服务器部署：docker compose up -d                       （全部服务，含 app 和 nginx）
#
# 用法：cp .env.example .env && 填好变量
# 中间件端口只绑 127.0.0.1（仅本机可达）：MySQL 13306、Redis 6379、MinIO 9000/9001
#
# 各服务的内存上限与几个吃内存的参数**走环境变量**，默认值是本地开发用的宽松值。
# 小内存机器（2C2G 这类）照 .env.example 里"小内存机型"那一段改，别改这个文件——
# 改这里会让服务器上的配置和仓库里的事实对不上，下次拉取就丢了。

services:
  mysql:
    image: mysql:8.0
    container_name: repair-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repair}
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
      --max-connections=200
      --slow-query-log=1
      --long-query-time=1
      --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-128M}
      --performance-schema=${MYSQL_PERFORMANCE_SCHEMA:-ON}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
      # 建表与基础数据现在由 **Flyway** 在应用启动时执行（src/main/resources/db/migration），
      # 不再往 docker-entrypoint-initdb.d 挂任何脚本。
      # 为什么换掉：initdb 只在数据卷为空时执行一次，库一旦有数据，改表就只能手工进容器 ALTER。
      # 顺带还绕开了那个坑——容器里 mysql 客户端默认 character_set_client=latin1，
      # 直接执行 .sql 会把中文按 latin1 写坏，而且不报错、看起来像成功了。
    networks: [backend]
    # 绑定 127.0.0.1：既能让你本机 IDEA 连上，又不会暴露到局域网/公网（服务器上同样安全）
    # 宿主端口用 13306 而非 3306：本机已装原生 MySQL80 服务占着 3306
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${MYSQL_MEM_LIMIT:-768M}

  redis:
    # 官方镜像足够：Sa-Token 会话、延迟队列（ZSet）、限流计数、登录审计去重都只用到核心命令，
    # redis-stack 多出的 RediSearch 从未被 MODULE 加载过——M4 的 Schema 注入走的是
    # 全量拼提示词（docs/04 ADR-005 背景 + pom.xml），embedding 方案已放弃，
    # 那个 module 在 2C2G 上只是白占内存。
    #
    # 淘汰策略必须是 volatile-lru，**不要改回 allkeys-lru**（口令见 docs/04 ADR-016）：
    #   volatile-lru 只淘汰"设了 TTL 的键"，而这台 Redis 上的键里唯独超时队列的两个 ZSet
    #   （ticket:timeout:ACCEPT / ticket:timeout:EVAL）没有 TTL。它恰恰是唯一"丢了就永久丢"
    #   的数据——成员被淘汰意味着那些工单再也不会被超时提醒 / 自动关闭，而且全程没有任何报错。
    #   allkeys-lru 会连它一起淘汰。
    # 代价（有意接受）：会话键是有 TTL 的，内存真满时会话可能先被淘汰 → 用户重新登录即可恢复；
    #   这个降级比"静默丢掉超时任务"轻得多。
    # 策略**故意不做成环境变量**：它是个安全开关，不该留一个能被误改成 allkeys-lru 的口子。
    image: redis:7-alpine
    container_name: repair-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy volatile-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks: [backend]
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-384M}

  minio:
    # ⚠️ 这个镜像源已经换过两次，**两次都是 MinIO 自己收紧了分发**，不是我们配错：
    #   1) Docker Hub 的 `minio/minio` 拉不到（pull access denied）→ 改用 quay.io
    #   2) 2026-09-25：quay.io/minio/minio 变成 401（要认证），而 Docker Hub 上那个仓库
    #      已经**不存在**了 → 改用 Bitnami 的 legacy 镜像（同一个 MinIO 二进制，社区镜像下架后它还在）
    # 顺带把标签**钉死**：之前用 `:latest`，结果镜像一消失就无从追溯该用哪个版本。
    #
    # 与官方镜像的用法有两处不同（Bitnami 的 entrypoint 按环境变量组装命令，不认 `command:`）：
    #   · 数据目录要用 MINIO_DATA_DIR 指定。默认是 /bitnami/minio/data，**不指定的话数据不会落进挂载卷**
    #     （这种错不会报错、只会安静地把数据放进容器内层——CI 里专门断言了挂载目录下有 .minio.sys 来防它）
    #   · 容器默认以非 root 运行，而挂载目录属于 root → 显式 user: root（官方镜像本来也是 root 跑的）
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: repair-minio
    restart: unless-stopped
    user: root
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DATA_DIR: /data
      # 管理台端口，对应官方镜像那个 `--console-address ":9001"`
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    volumes:
      - ./data/minio:/data
    # 同时挂 frontend：nginx 要反代 /files/ 到它（见 nginx.conf）。
    # 另一条路是把 nginx 接进 backend，但那会让 nginx 也能碰到 MySQL / Redis——
    # 让唯一对外暴露的容器离数据库远一点，是这张网络分区图存在的意义。
    networks: [backend, frontend]
    # 只给本机访问：9000 是 S3 API（应用/调试用），9001 是管理台
    # 公网要看图走 nginx 的 /files/，不靠把这两个端口开出去
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEM_LIMIT:-256M}

  # ============================================================
  # RocketMQ（阶段 2 · ADR-023）—— 只在 `--profile rocketmq` 时启动
  # ============================================================
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: repair-rocketmq-namesrv
    restart: unless-stopped
    profiles: ["rocketmq"]
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    volumes:
      - ./logs/rocketmq/namesrv:/home/rocketmq/logs
    ports:
      - "127.0.0.1:9876:9876"
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: ${ROCKETMQ_NAMESRV_MEM_LIMIT:-384M}

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: repair-rocketmq-broker
    restart: unless-stopped
    profiles: ["rocketmq"]
    depends_on: [rocketmq-namesrv]
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - ./data/rocketmq/broker:/home/rocketmq/store
      - ./logs/rocketmq/broker:/home/rocketmq/logs
    ports:
      - "127.0.0.1:10909:10909"
      - "127.0.0.1:10911:10911"
      - "127.0.0.1:10912:10912"
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: ${ROCKETMQ_BROKER_MEM_LIMIT:-1G}

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: repair-rocketmq-dashboard
    restart: unless-stopped
    profiles: ["rocketmq"]
    depends_on: [rocketmq-namesrv]
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    ports:
      - "127.0.0.1:8082:8080"
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: ${ROCKETMQ_DASHBOARD_MEM_LIMIT:-512M}

  # ============================================================
  # notification-service（阶段 2 · ADR-023/024）—— 独立构件、独立镜像
  # 启动：docker compose --profile rocketmq --profile notification up -d
  # 单体必须设 ROCKETMQ_CONSUMER_ENABLED=false，避免两个进程同时消费
  #
  # CD 目前只构建单体镜像（生产没开 MQ profile）；要在这里跑 notification 前，
  # 先在 CD 里加 `docker compose build notification`。
  # ============================================================
  notification:
    build:
      context: .
      dockerfile: Dockerfile.notification
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    image: repair-notification-service:latest
    container_name: repair-notification-service
    restart: unless-stopped
    profiles: ["notification"]
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: notification
      TZ: Asia/Shanghai
      JAVA_MAX_RAM_PERCENTAGE: ${NOTIFICATION_JAVA_MAX_RAM_PERCENTAGE:-55}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repair}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REPAIR_ROCKETMQ_ENABLED: "true"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      ROCKETMQ_CONSUMER_GROUP: repair-notification-service
      ROCKETMQ_CONSUMER_ENABLED: "true"
    # 独立可执行 jar，直接 -jar 启动；不再是"共用单体 jar + PropertiesLauncher 指入口"
    entrypoint:
      - sh
      - -c
      - >-
        java
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=$${JAVA_MAX_RAM_PERCENTAGE:-55}
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs
        -Duser.timezone=Asia/Shanghai
        -jar app.jar
    volumes:
      - ./logs/notification:/app/logs
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: ${NOTIFICATION_MEM_LIMIT:-512M}

  # ============================================================
  # timeout-service（阶段 2 · ADR-024）—— 超时域独立进程
  # 启动：docker compose --profile timeout up -d timeout
  # zset 模式下与单体并行安全：秒级消费按 ZREM 返回值去重（ADR-001 多实例口径），
  # 三个动作幂等（状态 CAS + ticket_log 判重）；兜底扫描会双跑一轮——浪费但不重复动作，
  # delivery=mq（下一刀）后用开关把兜底收敛回单体。
  # CD 目前只构建单体镜像（生产没开本 profile）；要跑 timeout 前先在 CD 加 build timeout。
  # ============================================================
  timeout:
    build:
      context: .
      dockerfile: Dockerfile.timeout
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    image: repair-timeout-service:latest
    container_name: repair-timeout-service
    restart: unless-stopped
    profiles: ["timeout"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: timeout
      TZ: Asia/Shanghai
      JAVA_MAX_RAM_PERCENTAGE: ${TIMEOUT_JAVA_MAX_RAM_PERCENTAGE:-55}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repair}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    entrypoint:
      - sh
      - -c
      - >-
        java
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=$${JAVA_MAX_RAM_PERCENTAGE:-55}
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs
        -Duser.timezone=Asia/Shanghai
        -jar app.jar
    volumes:
      - ./logs/timeout:/app/logs
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: ${TIMEOUT_MEM_LIMIT:-384M}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 国内构建要换 Maven 镜像源，否则会卡在 TLS 中断上（见 Dockerfile 注释与 .env.example）
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    image: ${IMAGE_NAME:-repair-app:latest}
    container_name: repair-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # ⚠️ .env 里的变量**不会自动进容器**：compose 只拿它做文件内的 `${}` 替换。
    #    要让应用读到，要么在 environment 里逐条列出，要么整个文件传进去（这里选后者）。
    #
    #    为什么用 env_file 而不是逐条列：踩过——把演示模式的配置写进 .env 却没在 environment 里列出，
    #    结果是"配置写了、应用读不到"，演示模式一直不生效，日志里连一行都没有，很不好查。
    #    现在只要求"写进 .env 即可"，新增配置不必再回来改这个文件。
    #    注意下面的 environment 优先级更高，所以容器网络内的地址不会被 .env 里的值覆盖。
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      # 容器内存上限的百分之多少给堆（见 Dockerfile）。留 30% 给元空间/线程栈/直接内存，
      # 小内存机型上这个比例要下调，否则堆没满、容器先被 OOM killer 干掉
      JAVA_MAX_RAM_PERCENTAGE: ${JAVA_MAX_RAM_PERCENTAGE:-70}
      # 以下必须是**容器网络内的地址**，不能被 .env 覆盖（.env 里的是给宿主机/浏览器用的）
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repair}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 应用连 MinIO 走容器网络地址；返回给前端的图片 URL 必须用"浏览器能访问到的地址"
      # （线上是 http://域名:8080/files，走 nginx 反代）——合成一个键就会出现"内网地址进了数据库、前端打不开"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-repair}
      # AI 相关：Key 只从环境变量注入，绝不写进代码或仓库
      AI_MODEL_API_KEY: ${AI_MODEL_API_KEY}
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL:-https://api.deepseek.com}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-deepseek-chat}
    volumes:
      - ./logs/app:/app/logs
    networks: [backend, frontend]
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-768M}

  nginx:
    image: nginx:1.27-alpine
    container_name: repair-nginx
    restart: unless-stopped
    depends_on: [app]
    ports:
      # 域名入口：80 只做 HTTPS 跳转，443 是业务入口。
      # 本机 8080 常被 IDEA 里跑的应用占着，所以保留一个 8080 别名；
      # 本地只起中间件（mysql redis minio）时不会碰这两个端口。
      - "80:80"
      - "443:443"
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书只放服务器上，不进 Git：./nginx/certs/{域名}_bundle.crt 与 .key
      - ./nginx/certs:/etc/nginx/certs:ro
      # 两个前端的产物目录。目录还不存在时 Docker 会挂成空目录、访问 / 与 /h5/ 返回 403，属预期不是故障。
      # 注意两边路径不同：web-admin 构建到 dist/，而 miniapp-h5（uni-app）构建到 dist/build/h5/
      # —— 写错这一处会静默挂上空目录，表现为"/h5/ 打不开"。
      - ./web-admin/dist:/usr/share/nginx/html/admin:ro
      - ./miniapp-h5/dist/build/h5:/usr/share/nginx/html/h5:ro
    networks: [frontend]

  # ============================================================
  # 可观测性（profile observability）—— **默认不启动**
  #
  # ⚠️ 2C4G 以下不要启用：Prometheus + Grafana 冷启动实测约 90M，长期随序列数增长
  #    （一般 200–300M），2C2G 上会和应用抢内存、把应用挤进 swap。
  #
  #    本地或升级实例后：
  #      docker compose --profile observability up -d prometheus grafana node-exporter
  #    本机 IDEA 跑应用时设 PROMETHEUS_TARGET=host.docker.internal:8080；
  #    compose 里起应用（app:8080）时用默认值即可。
  #
  # 安全：端口都只绑 127.0.0.1；线上用 SSH 隧道访问 Grafana，
  #      不要把 9090/3000/9100 映射到公网（ADR-020：指标会暴露内部结构）。
  #
  # 说明：应用侧的 /actuator/prometheus 已经存在；notification-service
  #      是 WebApplicationType.NONE，暂时没有 HTTP 端口可抓（见 observability/prometheus.yml）。
  # ============================================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: repair-node-exporter
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      # 只读挂宿主机的 /proc、/sys、/：node_exporter 靠它们读 CPU/内存/磁盘
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: ${NODE_EXPORTER_MEM_LIMIT:-64M}

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: repair-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    # Prometheus 不展开 targets 里的环境变量，所以在启动脚本里先替换占位符再启动。
    # 目标默认 app:8080（compose 网络内）；本地 IDEA 跑应用时用 PROMETHEUS_TARGET 覆盖。
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|__PROMETHEUS_TARGET__|${PROMETHEUS_TARGET:-app:8080}|g" \
            /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        exec /bin/prometheus \
            --config.file=/tmp/prometheus.yml \
            --storage.tsdb.path=/prometheus \
            --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d} \
            --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEM_LIMIT:-384M}

  grafana:
    image: grafana/grafana:11.3.0
    container_name: repair-grafana
    restart: unless-stopped
    profiles: ["observability"]
    depends_on: [prometheus]
    # 联系人里的 URL / 收件地址在启动时渲染：Compose 会在解析 YAML 时先把 ${VAR} 插值掉
    # （.env 没配就是空串），而空值会让 Grafana 的 provisioning 直接失败退出
    # （实测报错：`either url or secret is required`）。所以用 $$ 让变量留到容器内展开，
    # 并做空值兜底。渲染到 /tmp 是因为 /etc/grafana/provisioning 是只读挂载，不能原地改。
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        rm -rf /tmp/provisioning
        mkdir -p /tmp/provisioning/alerting
        cp -r /etc/grafana/provisioning/. /tmp/provisioning/
        # $$ 是 Compose 的转义：不写 $$ 的话 Compose 会在解析 YAML 时就把变量换成空串。
        HOOK="$${WECOM_WEBHOOK_URL:-https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=REPLACE_ME}"
        HOOK_ESC=$(printf '%s' "$$HOOK" | sed 's/[&|]/\\&/g')
        MAIL_TO="$${ALERT_EMAIL_TO:-REPLACE_ME@example.com}"
        MAIL_ESC=$(printf '%s' "$$MAIL_TO" | sed 's/[&|]/\\&/g')
        sed -e "s|__WECOM_WEBHOOK_URL__|$$HOOK_ESC|g" \
            -e "s|__ALERT_EMAIL_TO__|$$MAIL_ESC|g" \
            /etc/grafana/provisioning/alerting/contact-points.yml \
            > /tmp/provisioning/alerting/contact-points.yml
        exec /run.sh
    environment:
      GF_PATHS_PROVISIONING: /tmp/provisioning
      # 不设匿名访问；密码只从 .env 读，默认 admin 仅用于本地首次登录
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # 邮件告警。QQ 邮箱：smtp.qq.com:465（隐式 TLS）+ 授权码，不是登录密码。
      # SMTP_USER 为空时 enabled 自动为 false，Grafana 照常启动，只是邮件发不出去。
      GF_SMTP_ENABLED: ${SMTP_USER:+true}
      GF_SMTP_HOST: ${SMTP_HOST:-smtp.qq.com:465}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_AUTH_CODE:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_USER:-}
      GF_SMTP_FROM_NAME: 报修平台监控
      GF_SMTP_SKIP_VERIFY: "false"
      # 收件地址：entrypoint 里用它渲染 email 联系人，所以必须显式注入容器环境。
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      # 企业微信群机器人 Webhook。占位值让 Grafana 总能完成 provisioning；
      # 没配真实地址时告警发不出去（日志可见），但监控本身不受影响。
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=REPLACE_ME}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # 数据源与看板都走 provisioning：换机器只要带上这几个文件
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEM_LIMIT:-256M}

  # cAdvisor 单独一个 profile：官方镜像在 gcr.io，而中国大陆服务器通常拉不到
  # （腾讯云镜像站只代理 Docker Hub）。需要容器级 CPU/内存时显式开启：
  #   CADVISOR_IMAGE=mirror.ccs.tencentyun.com/zcube/cadvisor:v0.49.1 \
  #     docker compose --profile observability --profile observability-cadvisor up -d ...
  # 本地 Docker Desktop 能直连 gcr.io 时不用改。
  # 注意：cAdvisor 需要 privileged，属于额外权限；只要宿主/应用指标时不要开它。
  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.1}
    container_name: repair-cadvisor
    restart: unless-stopped
    profiles: ["observability-cadvisor"]
    privileged: true
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
    ports:
      - "127.0.0.1:9105:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: ${CADVISOR_MEM_LIMIT:-128M}

networks:
  backend:
    internal: false
  frontend:

volumes:
  # 只在使用 observability profile 时才会被创建
  prometheus-data:
  grafana-data:
