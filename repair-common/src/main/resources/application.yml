# ============================================================
# 全服务共用的 Spring Boot 配置（阶段 2 · ADR-024）
# 本文件随 repair-common 进每个服务的 classpath：单体与独立消费者读同一份默认值，
# 差异只通过环境变量（compose 里已按服务传好）与各自的 profile 文件覆盖。
# 密码与 Key 一律走 ${ENV_VAR:默认值}，不在这里出现明文。
# ============================================================
spring:
  application:
    name: repair-platform

  # ============================================================
  # 定时调度线程池
  #
  # 超时调度有 4 个任务：3 个秒级消费（fixedDelay=1000）+ 1 个每分钟兜底扫描。
  # Spring 默认池大小是 **1**，四个任务共用一个线程串行执行——一旦兜底扫描（扫库 + 逐条处理）
  # 超过 1 秒，就会吃掉秒级消费的调度窗口，触发精度从"秒级"退化回"分钟级"，
  # 正是 ADR-001 要消灭的那个问题。所以这里显式给 4 个线程，让它们互不阻塞。
  # 任务数变化时同步调整（并检查 SchedulingConfig 的注释）。
  # ============================================================
  task:
    scheduling:
      pool:
        size: 4

  # ============================================================
  # 数据源 / Redis
  #
  # 这里是**平台库**（`repair`）的主池：控制面（`tenant` 等）与过渡期里存量租户的数据都在这个库。
  # 阶段 6 起，每个学校还有它自己的库（`repair_<编码>`），连接池**懒建、运行时才出现**，
  # 参数见 `repair.tenancy.*`（默认值写在 TenancyProperties 上，与 dispatch/timeout 那几组同一个手法）。
  # 两个池的取舍（为什么租户池只有 3 条、为什么必须每租户一个池）见 ADR-021。
  #
  # 变量名与 docker-compose.yml 的 app.environment 逐一对齐，不要改名。
  # 默认值统一取「宿主机映射端口」，这样在 IDEA 里直接运行就能连上本地中间件；
  # 容器内运行时由 compose 注入同名变量，覆盖成容器网络里的地址。
  #
  # 关键不对称点：MySQL 本地是 13306（宿主机映射），容器内是 3306 —— 所以这里必须
  # 写成占位符，不能写死。
  #
  # 本地（IDEA / 命令行）运行前需要提供：MYSQL_PASSWORD、REDIS_PASSWORD
  # 两个口令都从环境变量读、默认空值：缺失时表现为"认证失败"而不是静默连错库。
  # CI 里的 Redis 是临时容器、不开密码，所以那边不需要设 REDIS_PASSWORD。
  # ============================================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:repair}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: RepairHikariPool
      # 2C4G 单机：连接池不是越大越好，池越大 MySQL 侧的并发线程与内存压力越高
      maximum-pool-size: 12
      minimum-idle: 4
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ============================================================
  # 数据库迁移（Flyway）：表结构的执行真相在 src/main/resources/db/migration
  #
  # 在这之前用的是 docs/schema.sql：它只在 MySQL 容器首次初始化时执行一次，库里有数据之后
  # 改表就只剩「手工进容器 ALTER」——没有版本、没有记录、换台机器要重来一遍。
  #
  # baseline-on-migrate 是给**已有的库**准备的：库里有表但没有迁移历史时，Flyway 把当前状态
  # 标记成"基线已应用"，而不是报错退出或试图重新建表。空库（CI、全新部署）不受影响——
  # 它是"非空才基线"：schema 为空时老老实实从 V1 开始建。
  #
  # ⚠️ baseline-version 必须与"现有库的结构"对齐。现在的库就是 V1 建出来的样子，所以基线是 1，
  #    之后只跑 V2 及以后。将来若发现某个库的结构与 V 脚本对不上，正确做法是核对并补齐差异，
  #    **不是**调这个数字——调它只会把差异掩盖过去（核对方法见 docs/05 的「数据库迁移」一节）。
  #
  # 顺带说一句：迁移脚本走 JDBC 连接执行，不经过 mysql 命令行客户端，
  # 也就绕开了那个"客户端默认 latin1 把中文写坏"的坑。
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms

  jackson:
    time-zone: Asia/Shanghai

  # ============================================================
  # multipart 上传上限
  #
  # 容器上限（这边）比**业务上限**（5MB，docs/03 §7.3）略大：正常的"超了一点"由业务层返回
  # 50002 并带上明确文案；设成一样的话超限会在进 Controller 之前被容器拦掉，
  # 用户只看到一句笼统的失败提示。这里再大一点是给"明显异常的大包"兜底。
  # ============================================================
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB

server:
  port: 8080
  # 线上跑在 nginx 后面，读 X-Forwarded-* 才能拿到真实协议与客户端 IP
  forward-headers-strategy: framework

# ============================================================
# MyBatis-Plus
# ============================================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.bluemalic.repair.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 雪花 ID，与 AGENTS「主键不用自增」的约定一致
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================================
# RocketMQ（阶段 2 · ADR-023）
# 默认关闭：本地开发与测试不依赖 MQ；生产或 smoke test 设 REPAIR_ROCKETMQ_ENABLED=true
# ============================================================
repair:
  rocketmq:
    enabled: ${REPAIR_ROCKETMQ_ENABLED:false}
    name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
    topic: ${ROCKETMQ_TOPIC:repair-ticket-events}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:repair-producer}
    consumer-group: ${ROCKETMQ_CONSUMER_GROUP:repair-notification-consumer}
    # 抽独立 notification-service 时，单体设 false，避免两个进程同时消费
    consumer-enabled: ${ROCKETMQ_CONSUMER_ENABLED:true}
  notification:
    # sync（默认）：TicketNoticePublisher 直接写站内信；mq：写 Outbox，由 MQ 或本地 handler 投递
    delivery: ${REPAIR_NOTIFICATION_DELIVERY:sync}
  event-retention:
    # consumed_event 是追加型表，不清理会无限增长（唯一索引越大，消费插入越慢）。
    # 保留期只要覆盖 MQ 的最大重投窗口：RocketMQ 默认保留 72 小时，30 天有充足余量。
    enabled: ${REPAIR_EVENT_RETENTION_ENABLED:true}
    days: ${REPAIR_EVENT_RETENTION_DAYS:30}
    cron: ${REPAIR_EVENT_RETENTION_CRON:0 20 4 * * *}
  outbox:
    # relay 扫描开关（测试里关掉；排障时可临时关）
    relay-enabled: ${REPAIR_OUTBOX_RELAY_ENABLED:true}
    # 积压指标：NEW 事件总数 + 最老一条的年龄，供 Prometheus 抓取
    metrics-enabled: ${REPAIR_OUTBOX_METRICS_ENABLED:true}
    metrics-interval-ms: ${OUTBOX_METRICS_INTERVAL_MS:30000}

# ============================================================
# 鉴权（Sa-Token）
# 用默认的 opaque token 存 Redis，不是 JWT，所以没有密钥需要管理
# ============================================================
sa-token:
  # 前端按 Authorization: Bearer <token> 提交
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800        # 7 天
  active-timeout: -1     # 不因闲置提前失效，统一由 timeout 控制
  # 同一账号允许多端登录（H5 与将来的小程序各自持有一个 token）
  is-concurrent: true
  is-share: false
  # 跨端只用请求头，不读 Cookie 和请求体
  is-read-cookie: false
  is-read-body: false
  is-read-header: true
  token-style: uuid
  is-log: false
  is-print: false

# ============================================================
# 接口文档
# 页面：http://localhost:8080/doc.html （Knife4j 静态 UI）
# 描述：/v3/api-docs （springdoc 生成）
#
# 这里没有 knife4j.* 配置项：项目只引了 Knife4j 的静态 UI 包（没有自动装配），
# 那些配置项没有东西去读它，写了只会让人以为生效了。
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.bluemalic.repair.controller
  default-produces-media-type: application/json

# ============================================================
# 运维端点：只暴露 health（部署脚本与 nginx 依赖它），其余不对外
# ============================================================
management:
  endpoints:
    web:
      exposure:
        # 只露这几个：health 给部署健康检查；prometheus 给 scrape；metrics 给排障时手查。
        # **nginx 只反代 /actuator/health**，所以 prometheus 只能从容器网络/本机访问（ADR-020）。
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      # 所有指标带上应用名：将来同机多实例时（或接入统一采集时）能区分来源
      application: repair-platform

# ============================================================
# 日志
# traceId 由 TraceIdFilter 注入 MDC，贯穿单次请求的全部日志
# 本地需要看 SQL / 调试日志时设置 LOG_LEVEL_APP=debug
# ============================================================
logging:
  level:
    root: info
    com.bluemalic.repair: ${LOG_LEVEL_APP:info}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
