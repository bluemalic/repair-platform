# ============================================================
# 数据库迁移作业
# ============================================================
#
# 关闭 Spring Boot 自带的 Flyway 自动迁移：本作业用 Flyway API 显式决定
# 迁移哪些库、用哪套脚本（控制库 db/migration + 每个租户库 db/tenant）。
# 交给自动配置只会迁移控制库一套，租户库要再写一遍，反而两处不一致。
# ============================================================
spring:
  application:
    name: repair-db-migrator
  flyway:
    enabled: false
  main:
    banner-mode: off
