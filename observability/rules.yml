# 告警规则骨架：先让规则跑起来并能在 Prometheus/Grafana 里看到，
# 通知渠道（Alertmanager / 企业微信 / 邮件）等真正需要时再接——那需要额外的常驻进程。
#
# 阈值按当前 2C2G 演示站的量级定，不是最终生产值；接入真实流量后再按 p99 调。
groups:
  - name: repair-platform
    rules:
      - alert: AppDown
        expr: up{job="repair-app"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "报修平台应用不可达"
          description: "Prometheus 已持续 2 分钟抓不到 {{ $labels.instance }}"

      - alert: High5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx 比例超过 5%"
          description: "近 5 分钟 5xx 占比 {{ $value | humanizePercentage }}"

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP P95 超过 1 秒"
          description: "近 5 分钟 P95 = {{ $value }}s"

      - alert: HeapUsageHigh
        expr: |
          sum(jvm_memory_used_bytes{area="heap"})
            /
          clamp_min(sum(jvm_memory_max_bytes{area="heap"}), 1)
          > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆使用率超过 90%"
          description: "当前堆使用率 {{ $value | humanizePercentage }}，先看是不是流量涨了或泄漏"

      - alert: HikariPending
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接池出现排队"
          description: "{{ $labels.pool }} 有 {{ $value }} 个线程在等连接"
