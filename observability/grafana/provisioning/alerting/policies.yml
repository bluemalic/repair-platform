# 所有告警默认走邮件（QQ 邮箱 SMTP）。企业微信是可选通道：
# 把下面 receiver 改成 wecom 并配好 .env 的 WECOM_WEBHOOK_URL 即可；
# 两个都要发就在 route 下加一条 continue: true 的子路由（Grafana 统一告警支持）。
apiVersion: 1

policies:
  - orgId: 1
    receiver: email
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
