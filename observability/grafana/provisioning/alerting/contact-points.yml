# 告警联系人：邮件是默认通道，企业微信作为可选通道保留。
#
# 两个 URL/地址都不直接写 ${VAR}，原因有两条：
#   1) Compose 会在解析 YAML 时先插值，.env 没配就变成空串；
#   2) 空值会让 Grafana 的 provisioning 直接失败退出（either url or secret is required）。
# 所以这里写占位符，由 compose 的 entrypoint 在启动时替换，和在 prometheus.yml 里
# 处理抓取目标的做法一致。占位符不会被提交成真实值。
#
# 邮件走 .env 的 SMTP_*（QQ 邮箱：smtp.qq.com:465 + 授权码）；地址取自 ALERT_EMAIL_TO。
# 企业微信群机器人地址就是“钥匙”，不要提交真实值。
apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email
        type: email
        disableResolveMessage: false
        settings:
          addresses: __ALERT_EMAIL_TO__
          singleEmail: false

  - orgId: 1
    name: wecom
    receivers:
      - uid: wecom
        type: wecom
        disableResolveMessage: false
        settings:
          url: __WECOM_WEBHOOK_URL__
          message: |
            {{ range .Alerts }}[{{ .Status }}] {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}
