# RocketMQ 5.3.2 单机 broker（本地/演示用，不是生产高可用配置）
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

# 容器内客户端（repair-app）用服务名；如果应用在宿主机 IDEA 里跑，
# 把这里改成 127.0.0.1（或把应用放进 Docker Compose）。
brokerIP1=rocketmq-broker

# 定时消息（5.x timer）：超时的 24h/48h/验收 24h 走它（delivery=mq）。
# timerWheelEnable 在 5.x 默认就是 true，这里显式写出来，防止换镜像 / 配置时
# 默认值变化导致定时消息静默失效（表现是"超时永远不触发"，很难查）。
timerWheelEnable=true
timerPrecisionMs=1000
# 最长可投递 7 天；当前最大阈值 48h，留足余量
timerMaxDelaySec=604800
