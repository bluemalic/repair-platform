# 单域名 + 多路径：/ 管理端、/h5/ 学生端、/api/ 后端

upstream repair_app {
    server app:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    charset utf-8;
    client_max_body_size 20m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ---------- 后勤管理端（Vue 3 打包产物） ----------
    # ⚠️ web-admin/ 已有代码但还没构建出 dist（`cd web-admin && npm run build`）——
    #    未构建前访问 / 会是 403 / 空白，属预期；构建后由 compose 挂载 ./web-admin/dist。
    location / {
        root      /usr/share/nginx/html/admin;
        index     index.html;
        try_files $uri $uri/ /index.html;   # 前端路由 history 模式必需

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---------- 学生端 H5 ----------
    # 工程在 miniapp-h5/（骨架已就绪，业务页开发中）。注意产物路径是 uni-app 的约定：
    # `npm run build:h5` 输出到 dist/build/h5/，不是 dist/ 根下。
    location /h5/ {
        alias     /usr/share/nginx/html/h5/;
        index     index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # ---------- AI 流式接口（SSE）----------
    # 必须关闭缓冲，否则前端拿不到流式输出
    # 路径与 docs/03-接口规范.md 的 /api/ai/query/stream 必须保持一致，
    # 否则请求会落到下面带缓冲的 /api/ 里，流式输出失效。
    location /api/ai/query/stream {
        proxy_pass         http://repair_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ---------- 工单图片（MinIO 里的对象）----------
    # 中间件只绑 127.0.0.1，公网拿不到 http://IP:9000/... 这个地址，而图片 URL 是要给浏览器用的。
    # 应用按 MINIO_PUBLIC_BASE_URL 拼出 {base}/{bucket}/{对象键}，把它指到本 location
    # （.env 里设成 http://<域名或IP>:8080/files），由 nginx 反代进容器网络——对外只留一个入口，
    # 不必把 S3 端口暴露到公网。
    #
    # ⚠️ proxy_pass 结尾那个斜杠不能省：它会把 location 匹配掉的 /files/ 前缀替换成 /。
    #    少了它，请求会以 /files/repair/... 的原样打到 MinIO 上，而 MinIO 上没有叫 files 的桶，
    #    匿名访问返回 **403**（不是 404——MinIO 不泄露桶是否存在）。实测：加斜杠 200，去掉斜杠 403。
    #    表现是"图片上传成功但打不开"，而应用和 nginx 的日志都很干净，很难查。
    location /files/ {
        proxy_pass         http://minio:9000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # 对象名是 uuid、内容不会被改写，可以放心让浏览器缓存
        add_header         Cache-Control "public, max-age=86400";
    }

    # ---------- 普通接口 ----------
    location /api/ {
        proxy_pass         http://repair_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ---------- 接口文档（上线后建议加访问限制）----------
    # 只转发 /doc.html 是不够的：页面本身是 HTML，但它的 JS/CSS 在 /webjars/ 下，
    # OpenAPI 描述在 /v3/api-docs，缺了这几个 location 会看到白屏或资源 404。
    location /doc.html {
        proxy_pass http://repair_app;
        proxy_set_header Host $host;
    }
    location /webjars/ {
        proxy_pass http://repair_app;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://repair_app;
        proxy_set_header Host $host;
    }
    location /swagger-resources/ {
        proxy_pass http://repair_app;
        proxy_set_header Host $host;
    }
    location = /favicon.ico {
        proxy_pass http://repair_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- 健康检查 ----------
    location /actuator/health {
        proxy_pass http://repair_app;
        access_log off;
    }
}
