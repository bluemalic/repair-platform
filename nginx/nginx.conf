# 单域名 + 多路径：/ 管理端、/h5/ 学生端、/api/ 后端
#
# 80 只做 HTTPS 跳转；业务配置全部在 443 的 server 块里。
# 证书由 docker-compose 挂载到 /etc/nginx/certs（见 docker-compose.yml 的 nginx.volumes）。

upstream repair_app {
    # 统一入口：nginx → gateway → app。gateway 做登录校验/身份头，app 只在内网。
    server gateway:8080;
    keepalive 32;
}

# ---------- HTTP：只做跳转 ----------
server {
    listen       80;
    server_name  bluemalic.cn;

    # 用 Let's Encrypt HTTP-01 续期时保留；腾讯云免费证书不走这里，
    # 访问不到也只是 404，不影响正常跳转。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bluemalic.cn$request_uri;
    }
}

# ---------- HTTPS：业务入口 ----------
server {
    listen       443 ssl;
    http2        on;
    server_name  bluemalic.cn;

    ssl_certificate     /etc/nginx/certs/bluemalic.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/bluemalic.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 确认全站 HTTPS 稳定后再开 HSTS（开了以后浏览器会强制走 HTTPS）：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    charset utf-8;
    client_max_body_size 20m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ---------- 前端（官网落地页 + 管理端，Vue 3 打包产物） ----------
    # `/` 是公开落地页，`/login`、`/platform/login` 是登录入口，`/console/...` 是后台；
    # 三者共用同一个 dist，由前端路由区分。try_files 是 history 模式必需：
    # 直接刷新 /console/tickets 这类深链时，服务器要回 index.html 让前端接管。
    location / {
        root      /usr/share/nginx/html/admin;
        index     index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---------- 学生端 H5 ----------
    # 工程在 miniapp-h5/（学生/维修工 11 个页面已完成）。注意产物路径是 uni-app 的约定：
    # `npm run build:h5` 输出到 dist/build/h5/，不是 dist/ 根下。
    location /h5/ {
        alias     /usr/share/nginx/html/h5/;
        index     index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # ---------- AI 流式接口（SSE）----------
    # 必须关闭缓冲，否则前端拿不到流式输出
    # 路径与 docs/03-接口规范.md 的 /api/ai/query/stream 必须保持一致，
    # 否则请求会落到下面带缓冲的 /api/ 里，流式输出失效。
    location /api/ai/query/stream {
        proxy_pass         http://repair_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ---------- 普通接口 ----------
    location /api/ {
        proxy_pass         http://repair_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ---------- 接口文档（上线后建议加访问限制）----------
    # 只转发 /doc.html 是不够的：页面本身是 HTML，但它的 JS/CSS 在 /webjars/ 下，
    # OpenAPI 描述在 /v3/api-docs，缺了这几个 location 会看到白屏或资源 404。
    location /doc.html {
        proxy_pass http://repair_app;
        proxy_set_header Host $host;
    }
    location /webjars/ {
        proxy_pass http://repair_app;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://repair_app;
        proxy_set_header Host $host;
    }
    location /swagger-resources/ {
        proxy_pass http://repair_app;
        proxy_set_header Host $host;
    }
    location = /favicon.ico {
        proxy_pass http://repair_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- 健康检查 ----------
    location /actuator/health {
        proxy_pass http://repair_app;
        # ⚠️ 这一行不能省，而且只有这里最容易漏（其它代理块都写了）。
        #    不设 Host 时 nginx 用 $proxy_host，也就是 upstream 的名字 repair_app；
        #    而 Tomcat 认为域名里的下划线非法，直接回 **400 Bad Request**：
        #      The character [_] is never valid in a domain name.
        #    现象是"健康检查返回 400，但服务其实好着"——绕开 nginx 直接问应用是 200，
        #    很容易被当成应用故障去查半天。upstream 名换个没下划线的也行，
        #    但显式设置 Host 才是根本，因为它对任何 upstream 名都成立。
        proxy_set_header   Host $host;
        access_log off;
    }
}
